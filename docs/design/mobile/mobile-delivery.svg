<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="995" viewBox="0 0 1040 995" role="img" aria-labelledby="title desc">
<title id="title">Mobile prototype delivery order</title><desc id="desc">Local client validation leads to a persistent host, synthetic phone experiment, recovery and two-client handoff, secure remote control, then the full demonstration. Embedded execution runs in parallel. Electron integration follows handoff and joins the final demonstration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66758b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<path d="M 300 155 V 205" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 310 V 360" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 465 V 515" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 620 V 670" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 775 V 825" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 100 H 795 V 205" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 795 310 V 350 H 1005 V 877 H 560" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 568 H 795 V 670" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 795 775 V 877 H 560" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="50" width="520" height="105" rx="14" fill="#edf3ff" stroke="#a6bfea" stroke-width="1.5"/>
<text x="300.0" y="76" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">1–2a · START HERE</text>
<text x="300.0" y="106" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Define and test the local client</text>
<text x="300.0" y="134" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Prove the interface and shared screen state</text>
<rect x="40" y="205" width="520" height="105" rx="14" fill="#edf3ff" stroke="#a6bfea" stroke-width="1.5"/>
<text x="300.0" y="231" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">3a–3c · HOST FOUNDATIONS</text>
<text x="300.0" y="261" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Build the persistent host</text>
<text x="300.0" y="289" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Exact targets, ownership, controller loss</text>
<rect x="40" y="360" width="520" height="105" rx="14" fill="#edf3ff" stroke="#a6bfea" stroke-width="1.5"/>
<text x="300.0" y="386" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">3d · PHONE EXPERIMENT</text>
<text x="300.0" y="416" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Try the phone early</text>
<text x="300.0" y="444" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Synthetic data and controlled tools only</text>
<rect x="40" y="515" width="520" height="105" rx="14" fill="#edf3ff" stroke="#a6bfea" stroke-width="1.5"/>
<text x="300.0" y="541" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">4a–4b + 5a · LOCAL VALIDATION</text>
<text x="300.0" y="571" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Add recovery and handoff</text>
<text x="300.0" y="599" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Snapshots, send IDs, two TypeScript clients</text>
<rect x="40" y="670" width="520" height="105" rx="14" fill="#edf3ff" stroke="#a6bfea" stroke-width="1.5"/>
<text x="300.0" y="696" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">6–7 · NETWORK AND PHONE</text>
<text x="300.0" y="726" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Enable secure remote control</text>
<text x="300.0" y="754" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Resolve pairing and access scope first</text>
<rect x="40" y="825" width="520" height="105" rx="14" fill="#edf8f3" stroke="#95c9b1" stroke-width="1.5"/>
<text x="300.0" y="851" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">8 · FULL PROTOTYPE</text>
<text x="300.0" y="881" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Demonstrate both modes</text>
<text x="300.0" y="909" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Include desktop-to-phone handoff</text>
<rect x="630" y="205" width="330" height="105" rx="14" fill="#fff4e9" stroke="#e1b181" stroke-width="1.5"/>
<text x="795.0" y="231" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">2b · PARALLEL</text>
<text x="795.0" y="261" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Prove on-device execution</text>
<text x="795.0" y="289" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Build on android-shell</text>
<rect x="630" y="670" width="330" height="105" rx="14" fill="#fff4e9" stroke="#e1b181" stroke-width="1.5"/>
<text x="795.0" y="696" text-anchor="middle" font-size="15" fill="#4b5e75" font-weight="700">5b · PARALLEL</text>
<text x="795.0" y="726" text-anchor="middle" font-size="23" fill="#172638" font-weight="700">Integrate Electron</text>
<text x="795.0" y="754" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Supported prototype sessions</text>
<text x="520" y="970" text-anchor="middle" font-size="18" fill="#4b5e75" font-weight="400">Security gates apply before real-session control or network exposure.</text>
</g></svg>
