<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Two modes in one mobile app</title><desc id="desc">A React Native app uses one shared session client. The embedded adapter runs the agent on the phone; the remote adapter controls an agent on the user’s host machine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66758b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<path d="M 450 102 V 138" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 450 222 V 260 H 240 V 295" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 450 260 H 660 V 295" fill="none" stroke="#66758b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="225" y="20" width="450" height="82" rx="14" fill="#edf3ff" stroke="#a6bfea" stroke-width="1.5"/>
<text x="450.0" y="57" text-anchor="middle" font-size="24" fill="#172638" font-weight="700">React Native mobile app</text>
<text x="450.0" y="86" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Shared screens for Android and iOS</text>
<rect x="225" y="138" width="450" height="84" rx="14" fill="#edf3ff" stroke="#a6bfea" stroke-width="1.5"/>
<text x="450.0" y="175" text-anchor="middle" font-size="24" fill="#172638" font-weight="700">Shared session client</text>
<text x="450.0" y="204" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Independent of Electron</text>
<rect x="40" y="295" width="400" height="90" rx="14" fill="#edf8f3" stroke="#95c9b1" stroke-width="1.5"/>
<text x="240.0" y="332" text-anchor="middle" font-size="24" fill="#172638" font-weight="700">On-device agent</text>
<text x="240.0" y="361" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Runs on the phone</text>
<rect x="460" y="295" width="400" height="90" rx="14" fill="#fff4e9" stroke="#e1b181" stroke-width="1.5"/>
<text x="660.0" y="332" text-anchor="middle" font-size="24" fill="#172638" font-weight="700">Remote control</text>
<text x="660.0" y="361" text-anchor="middle" font-size="18" fill="#172638" font-weight="400">Agent runs on the host machine</text>
<text x="240" y="249" text-anchor="middle" font-size="16" fill="#4b5e75" font-weight="400">Embedded adapter</text>
<text x="660" y="249" text-anchor="middle" font-size="16" fill="#4b5e75" font-weight="400">Remote adapter</text>
</g></svg>
