allowBuilds:
  core-js: false

overrides:
  serialize-javascript: "7.1.1"
  uuid: "^14.0.0"
  js-yaml: "^5.0.0"
  qs: "^6.16.0"
  gray-matter: "npm:@11ty/gray-matter@^3.0.0"
  image-size: "npm:image-size-next@2.1.1"

# Known high and critical advisories in build-time tooling that is not shipped; braces has no
# patched release. Any other high or critical advisory fails `pnpm audit --audit-level=high` in CI.
auditConfig:
  ignoreGhsas:
    - GHSA-qhr7-859c-m2p7
    - GHSA-6j4f-fj2g-mc7p
    - GHSA-ch52-4w7c-c8xp
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-5gmw-xhrv-c9v3
    - GHSA-85c8-ppgw-ccpr
