<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BraveBot</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        width: 18rem;
        margin: 0;
        padding: 0.75rem 1rem;
      }
      p {
        margin: 0 0 0.75rem;
      }
      p:empty {
        display: none;
      }
      button {
        font: inherit;
      }
      .note {
        color: #555;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <p id="on" role="status"></p>
    <p id="held" role="status"></p>
    <button type="button" id="turn-off">Turn everything off</button>
    <div id="status" class="note" role="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
