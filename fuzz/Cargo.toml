[package]
name = "bravebot-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# The same table as the root workspace's `[workspace.lints.clippy]`. This crate cannot inherit it
# with `[lints] workspace = true`: it declares its own `[workspace]` below so the root workspace
# never compiles libFuzzer, and a package in a workspace of its own has no outer table to inherit
# from. `contrib/check-fuzz-lints.py` fails when the two tables drift apart.
[lints.clippy]
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unused_async = "deny"
large_futures = "deny"
future_not_send = "deny"
let_underscore_future = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
allow_attributes_without_reason = "deny"

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
bravebot-agent = { path = "../crates/agent" }
bravebot-aichat = { path = "../crates/aichat" }
bravebot-bedrock = { path = "../crates/bedrock" }

# Its own workspace, so the root workspace never compiles libFuzzer's C++ and `cargo clippy
# --workspace`, nextest and the cross-builds are unchanged.
[workspace]

[[bin]]
name = "regex"
path = "fuzz_targets/regex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff"
path = "fuzz_targets/diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_stream"
path = "fuzz_targets/event_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false
bench = false
