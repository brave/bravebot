[workspace]
resolver = "3"
members = ["crates/agent", "crates/approval", "crates/backtrace", "crates/bedrock", "crates/browser", "crates/i18n", "crates/session", "crates/diag", "crates/stamp", "crates/tui", "crates/aichat", "crates/cli", "crates/config", "crates/connector", "crates/core", "crates/filetype", "crates/lsp", "crates/mcp", "crates/mentions", "crates/net", "crates/sandbox", "crates/signing", "crates/skus", "crates/ui-bridge", "crates/ui-files"]

[workspace.package]
version = "0.18.0"
edition = "2024"
# Matches the pinned cross-build container, so `cargo build` fails on a feature the
# release build could not compile rather than deferring that to CI.
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/brave/bravebot"

[workspace.lints.clippy]
# Lints this tree has no violation of in code that ships, held at zero. They are `deny` rather than
# `warn` so a plain `cargo clippy` and an editor refuse them too, not only the `-D warnings` that
# `make check` and CI add. A test may unwrap (`allow-unwrap-in-tests` in clippy.toml).
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unused_async = "deny"
large_futures = "deny"
future_not_send = "deny"
let_underscore_future = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"

[workspace.dependencies]
base64 = "0.22"
# The blinded-token scheme Brave's SKU SDK uses, at the version brave-core builds
# against. Hand-rolling Ristretto VOPRF would be far worse than depending on the
# implementation both ends of this protocol already agree on.
challenge-bypass-ristretto = { version = "2.1.0", features = ["serde_base64"] }
hmac = "0.12"
# Secret storage for the imported subscription credentials. Default features only:
# the sync-secret-service backend would pull in C libdbus and break the cross-builds,
# whereas the default zbus backend is pure Rust on every target here.
landlock = "0.4"
libc = "0.2"
# Pinned to the major version challenge-bypass-ristretto takes its RNG traits from, so
# OsRng is the same type both crates expect.
rand = "0.8"
# RSA PKCS#1 v1.5 with SHA-256, which verifies the ID token of a ChatGPT sign-in against the
# authorization server's key set. Already in Cargo.lock at this version with these features
# (alloc, dev_urandom_fallback), through rustls-webpki, so the lock gains the one line saying
# bravebot-skus uses it and nothing is built twice.
ring = "0.17.14"
rustix = "1"
# The zstd encoder for the body of a request to a ChatGPT account (CHATGPT-10). Pure Rust with no
# build script and no native code, where the `zstd` crate compiles the C library for every
# cross-build target. It encodes at one level, `Fastest`, which is roughly zstd level 1. `hash`
# writes the frame's checksum, which libzstd verifies, so a decoder that checks it refuses a frame
# this encoder got wrong where it would otherwise read other text. `std` is the crate's default
# I/O, which the decoder the tests read frames back with needs. The one crate it brings is `twox-hash`,
# for the checksum, with only its `xxhash64`.
ruzstd = { version = "0.9", default-features = false, features = ["hash", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `unstable-rendered-line-info` is `Paragraph::line_count`, which is how the transcript knows
# how tall it will be once wrapped. Counting logical lines instead loses the bottom of any reply
# that wraps, and counting wrapped rows by hand means guessing at the widget's own rules.
ratatui = { version = "0.30", features = [
    "crossterm",
    "unstable-rendered-line-info",
] }
serde = { version = "1", features = ["derive"] }
# Decoding a picture the user dropped or pasted so the terminal can show it back to them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde_json = "1"
sha2 = "0.10"
# Test fixtures use private directories that are removed even when a test fails.
# This includes file-helper permission tests and isolated terminal session profiles.
tempfile = "3"
# Checks the decomposition tables in bravebot-core against the crate that publishes them. A
# dev-dependency only: gix-utils already depends on it, so the lock gains the one line saying
# bravebot-core's tests use it, and bravebot-core itself keeps no dependency at runtime.
unicode-normalization = "0.1"
unicode-width = "0.2"
# The Win32 calls that keep the imported subscription file readable by one account, which is what
# stands in for a mode on Windows. Microsoft's own generated bindings, one crate deep
# (windows-link), and both are already entries in Cargo.lock at this version, since rustix, mio and
# errno each declare them for their own Windows builds: the lock gains the one line that says this
# crate uses them. The Windows binary does compile them for the first time, which hand-written
# `extern "system"` declarations would avoid at the price of spelling the layout of a security
# descriptor, SECURITY_ATTRIBUTES and TOKEN_USER by hand, in a crate that denies unsafe code and
# where a field of the wrong width silently widens the list. The features are the modules the calls
# live in.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# Rust's built-in strip can corrupt some targets under cargo-zigbuild, so
# release builds leave symbols in place and strip during packaging instead.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Dependencies are built optimised in a debug build too. Decoding and scaling a picture and drawing
# every prompt at every scroll position took tens of seconds a test unoptimised and a few seconds
# optimised, and the dependencies are rebuilt only when the lockfile moves. The workspace's own
# crates stay unoptimised, so an edit to them rebuilds as fast as before.
[profile.dev.package."*"]
opt-level = 2
