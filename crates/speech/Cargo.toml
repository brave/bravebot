[package]
name = "bravebot-speech"
description = "Speech input (Vosk STT) and output (TTS) with strict provenance boundaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
speech = ["vosk-backend"]
vosk-backend = ["dep:vosk", "dep:cpal"]

[dependencies]
bravebot-core = { path = "../core" }
bravebot-net = { path = "../net" }
bravebot-i18n = { path = "../i18n" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
vosk = { version = "0.3.1", optional = true }
cpal = { version = "0.15", optional = true }
