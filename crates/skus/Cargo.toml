[package]
name = "bravebot-skus"
description = "Imports a Leo Premium subscription from a local Brave install by registering as a new device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# A test points the ChatGPT sign-in at a server of its own through this, and nothing else does. Only
# the [dev-dependencies] of a crate whose tests need it enable it, and a release build refuses it.
[features]
test-hosts = []

[dependencies]
challenge-bypass-ristretto = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }

# Windows has no file mode, so the access-control list that stands in for one is set through these.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
