[package]
name = "bravebot-config"
description = "Environment-derived configuration for the aichat backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Holds a credential in pages the kernel keeps out of swap, a platform call this crate forbids
# itself. It brings libc, landlock and windows-sys with it, and adds no crate to the lockfile:
# every binary that ships this one links it already.
bravebot-sandbox = { path = "../sandbox" }
serde_json = { workspace = true }
sha2 = { workspace = true }
