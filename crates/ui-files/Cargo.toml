[package]
name = "bravebot-ui-files"
description = "Reads and writes files for the graphical front end, under a pinned directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# Already in the lockfile for sandbox and skus. The features add the kernel-mode calls the walk is
# made of, since Win32 has no open relative to a directory, and nothing to the tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = { workspace = true }
