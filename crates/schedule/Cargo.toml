[package]
name = "bravebot-schedule"
description = "The scheduled runs a person registers with the system scheduler, as functions that return their text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Where the entries are kept, through the state directory's helpers.
bravebot-agent = { path = "../agent" }
# The credentials a scheduled run's helper programs are started without.
bravebot-config = { path = "../config" }
bravebot-core = { path = "../core" }
# The words of every line a subcommand returns.
bravebot-i18n = { path = "../i18n" }
# Finding and starting the scheduler's own programs under the spawn gate.
bravebot-sandbox = { path = "../sandbox" }
# The search index a recorded run is written to, and the sessions an entry resumes.
bravebot-session = { path = "../session" }

[dev-dependencies]
tempfile = { workspace = true }
