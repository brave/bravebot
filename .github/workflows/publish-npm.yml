name: Publish npm

# Started by hand, after the tag exists and after Jenkins has created the GitHub
# release. Authentication is OIDC: there is no NPM_TOKEN.
#
# On npmjs.com, the trusted publisher for @brave/bravebot must name this file
# exactly: publish-npm.yml
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (v followed by the version in the tree)
        required: true
        type: string

# The floor for anything added here later. The OIDC grant is not in it: it is
# declared on the one job that publishes, because a grant is readable by every step
# of the job that holds it, so the job is the smallest boundary it has.
permissions:
  contents: read

jobs:
  # lockfile-lint and the packages under it are code nobody here wrote, and the step
  # below runs them by design. They run in this job, which can read nothing but the
  # tree, rather than beside the token the publish job mints.
  #
  # Not left to ci.yml's npm-lockfile job, which runs the same two commands: nothing
  # here requires that job to have passed, so a tag moved after it ran would be
  # linted nowhere.
  lint:
    name: Lint the lockfile
    if: github.repository == 'brave/bravebot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      - name: Lint the lockfile
        run: npm run lint:lockfile

  # The trusted publisher on npmjs.com keys on this repository and this filename, not
  # on a job name, so publishing is unaffected by which job here holds the grant.
  publish:
    name: Publish @brave/bravebot
    needs: lint
    if: github.repository == 'brave/bravebot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Refuse a tag that does not match the tree
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' Cargo.toml | head -n 1)"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ -z "$cargo_version" ] || [ "$pkg_version" != "$cargo_version" ]; then
            echo "error: package.json ($pkg_version) does not match Cargo.toml ($cargo_version)"
            exit 1
          fi
          if [ "$TAG" != "v${pkg_version}" ]; then
            echo "error: tag $TAG does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Refuse a GitHub release that is missing a platform asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=""
          for asset in \
            bravebot-darwin-arm64 \
            bravebot-darwin-amd64 \
            bravebot-linux-amd64 \
            bravebot-linux-arm64 \
            bravebot-windows-amd64.exe \
            bravebot-windows-arm64.exe
          do
            if ! printf '%s\n' "$names" | grep -qxF "$asset"; then
              missing="$missing $asset"
            fi
            if ! printf '%s\n' "$names" | grep -qxF "${asset}.sha256"; then
              missing="$missing ${asset}.sha256"
            fi
          done
          if [ -n "$missing" ]; then
            echo "error: GitHub release $TAG is missing:$missing"
            echo "run Jenkins job bravebot-build (UPLOAD and RELEASE) first"
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Provenance is attached automatically for trusted publishing from a public
      # repository. --provenance keeps that explicit. No NODE_AUTH_TOKEN: a token
      # would hide OIDC and skip the trusted-publisher path. --ignore-scripts keeps
      # postinstall from fetching a binary during the publish run itself.
      - name: Publish
        run: npm publish --access public --provenance --ignore-scripts
