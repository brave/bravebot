name: Publish npm

# Started by hand, after the tag exists and after Jenkins has created the GitHub
# release. Authentication is OIDC: there is no NPM_TOKEN.
#
# On npmjs.com, the trusted publisher for @brave/bravebot must name this file
# exactly: publish-npm.yml
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (v followed by the version in the tree)
        required: true
        type: string

# The floor for anything added here later. The OIDC grant is not in it: it is
# declared on the one job that publishes, because a grant is readable by every step
# of the job that holds it, so the job is the smallest boundary it has.
permissions:
  contents: read

jobs:
  # The wrapper declares no dependency, so there is nothing to install here and no
  # third-party code to run: the lint is a script in this tree and the check reads
  # package.json. It stays a job of its own, under `contents: read`, so the publish job
  # does not run repository scripts beside the token it mints.
  #
  # Not left to ci.yml's npm-lockfile job, which runs the same lint: nothing here
  # requires that job to have passed, so a tag moved after it ran would be linted nowhere.
  lint:
    name: Lint the lockfiles
    if: github.repository == 'brave/bravebot'
    runs-on: ubuntu-latest
    steps:
      # refs/tags/ rather than the bare name: handed an unqualified ref, this action
      # looks for a remote branch of that name before a tag of it, so a branch called
      # v0.9.0 is what a dispatch of v0.9.0 would lint. Qualified, the fetch is for the
      # tag alone and a tag that does not exist fails the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Refuse a dependency in the published package
        run: |
          set -eu
          node -e '
            const pkg = require("./package.json");
            const declared = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]
              .filter((key) => Object.keys(pkg[key] || {}).length > 0);
            if (declared.length > 0) {
              console.error("error: package.json declares " + declared.join(", ") + "; the wrapper has none");
              process.exit(1);
            }
          '

      - name: Lint the pnpm lockfiles
        run: python3 contrib/check-pnpm-lockfiles.py

  # The trusted publisher on npmjs.com keys on this repository and this filename, not
  # on a job name, so publishing is unaffected by which job here holds the grant.
  publish:
    name: Publish @brave/bravebot
    needs: lint
    if: github.repository == 'brave/bravebot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Qualified for the reason above, and here it is what pins the published bytes
      # to the tag: every gate below reads either this checkout or the GitHub release,
      # so a branch supplying the tree passes both and npm gets an unreviewed one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Refuse a tag that does not match the tree
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' Cargo.toml | head -n 1)"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ -z "$cargo_version" ] || [ "$pkg_version" != "$cargo_version" ]; then
            echo "error: package.json ($pkg_version) does not match Cargo.toml ($cargo_version)"
            exit 1
          fi
          if [ "$TAG" != "v${pkg_version}" ]; then
            echo "error: tag $TAG does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Refuse a GitHub release that is missing a platform asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=""
          for asset in \
            bravebot-darwin-arm64 \
            bravebot-darwin-amd64 \
            bravebot-linux-amd64 \
            bravebot-linux-arm64 \
            bravebot-windows-amd64.exe \
            bravebot-windows-arm64.exe
          do
            if ! printf '%s\n' "$names" | grep -qxF "$asset"; then
              missing="$missing $asset"
            fi
            if ! printf '%s\n' "$names" | grep -qxF "${asset}.sha256"; then
              missing="$missing ${asset}.sha256"
            fi
            # A Linux install with gpg refuses a checksum that has no signature beside it.
            case "$asset" in
              bravebot-linux-*)
                if ! printf '%s\n' "$names" | grep -qxF "${asset}.sha256.asc"; then
                  missing="$missing ${asset}.sha256.asc"
                fi
                ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "error: GitHub release $TAG is missing:$missing"
            echo "run Jenkins job bravebot-build (UPLOAD and RELEASE) first"
            exit 1
          fi

      # The key an installer checks against is the one in this tree, so a release signed by any
      # other key would publish a wrapper whose Linux installs all fail.
      - name: Refuse a Linux checksum whose signature does not verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          fingerprint="$(sed -n 's/^const SIGNING_KEY_FINGERPRINT = "\([0-9A-F]\{40\}\)";$/\1/p' npm/scripts/postinstall.js)"
          if [ -z "$fingerprint" ]; then
            echo "error: npm/scripts/postinstall.js names no signing key fingerprint"
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          downloads="$(mktemp -d)"
          sed -n '/-----BEGIN PGP PUBLIC KEY BLOCK-----/,/-----END PGP PUBLIC KEY BLOCK-----/p' npm/scripts/postinstall.js |
            sed -e 's/^.*\(-----BEGIN PGP PUBLIC KEY BLOCK-----\)/\1/' -e 's/\(-----END PGP PUBLIC KEY BLOCK-----\).*$/\1/' |
            gpg --batch --quiet --import
          for asset in bravebot-linux-amd64 bravebot-linux-arm64; do
            gh release download "$TAG" --dir "$downloads" \
              --pattern "${asset}.sha256" --pattern "${asset}.sha256.asc"
            status="$(gpg --batch --status-fd 1 --verify "$downloads/${asset}.sha256.asc" "$downloads/${asset}.sha256" 2>/dev/null)" || status=""
            if ! printf '%s\n' "$status" | grep -q "^\[GNUPG:\] VALIDSIG .* ${fingerprint}\$"; then
              echo "error: ${asset}.sha256.asc on GitHub release $TAG does not verify against key $fingerprint"
              exit 1
            fi
          done

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Provenance is attached automatically for trusted publishing from a public
      # repository. --provenance keeps that explicit. No NODE_AUTH_TOKEN: a token
      # would hide OIDC and skip the trusted-publisher path. --ignore-scripts keeps
      # postinstall from fetching a binary during the publish run itself.
      - name: Publish
        run: npm publish --access public --provenance --ignore-scripts
