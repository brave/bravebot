name: Build and Deploy Docs

# main is the only ref this site is ever built from, and the github-pages environment
# refuses a deploy from any other. A release tag is not a trigger: it names a commit
# main has already built and published. Nothing is committed to a gh-pages branch, so
# the served site is always whatever main built.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys rather than cancelling them, so an in-flight publish is never left half
# applied.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        # pnpm and Node in one step, and the install with it: require-lockfile runs a
        # frozen install, and the store rides the cache. No dependency there runs a
        # build script: pnpm refuses them all unless the project allow-lists one,
        # and docs/website lists none, which is what --ignore-scripts bought when
        # npm installed the site.
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: docs/website
          runtime: node@24
          require-lockfile: true
          cache: true

      # docusaurus.config.js throws on a broken link or anchor, so this step is the whole
      # of the site's correctness check as well as its build.
      - name: Build website
        run: pnpm --dir docs/website run build

      # include-hidden-files is off by default from v4 on, and static/.nojekyll is a
      # dotfile: without this the artifact ships without it and Pages goes back to hiding
      # every path beginning with an underscore.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/website/build
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
