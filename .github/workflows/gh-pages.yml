name: Build and Deploy Docs

# main is the only ref this site is ever built from, and the github-pages environment
# refuses a deploy from any other. A release tag is not a trigger: it names a commit
# main has already built and published. Nothing is committed to a gh-pages branch, so
# the served site is always whatever main built.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys rather than cancelling them, so an in-flight publish is never left half
# applied.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Corepack provides the pnpm version docs/website/package.json pins.
      - name: Enable pnpm
        id: pnpm
        run: |
          corepack enable
          echo "store=$(cd docs/website && pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-docs-${{ runner.os }}-${{ hashFiles('docs/website/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-docs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm --dir docs/website install --frozen-lockfile --ignore-scripts

      # docusaurus.config.js throws on a broken link or anchor, so this step is the whole
      # of the site's correctness check as well as its build.
      - name: Build website
        run: pnpm --dir docs/website run build

      # include-hidden-files is off by default from v4 on, and static/.nojekyll is a
      # dotfile: without this the artifact ships without it and Pages goes back to hiding
      # every path beginning with an underscore.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/website/build
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
