name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No credentials here, and none needed: these jobs compile and test rather than
  # producing a binary anyone installs. Signed, configured release binaries are built
  # and published by Jenkins, not this workflow.
  BRAVEBOT_ALLOW_UNCONFIGURED_BUILD: "1"

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        # Pinned to a full commit SHA, which is the control this rule is really after.
        # dtolnay/rust-toolchain publishes no semver release to name alongside it: its refs
        # are branches (`stable`, `master`, `1.104.0`) plus a single `v1` tag.
        # nosemgrep: brave-third-party-action-not-pinned-to-commit-sha
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --locked

  # The macOS confinement backend is compiled on no other platform, so without this job the
  # whole Seatbelt half of crates/sandbox, and every test that pins it, is neither built, run,
  # nor linted anywhere in CI. Clippy runs here for the same reason as the tests: the `check`
  # job cannot lint a module its target never compiles. Formatting is not repeated, since it
  # does not vary by platform.
  macos:
    name: Lint and test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        # Pinned to a full commit SHA; see the note in the `check` job above.
        # nosemgrep: brave-third-party-action-not-pinned-to-commit-sha
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --locked

  # Windows is a platform this project publishes binaries for, and nothing else here compiles its
  # arms of the tree for a check. cross-build produces the shipped binary and stops there: no
  # clippy, and no test target, so a `#[cfg(windows)]` block in a test is compiled nowhere and a
  # lint on one is reported nowhere. Same reason the macos job exists, for the platform with no
  # runner here.
  #
  # The target is the one that ships. A windows-latest runner defaults to -msvc, which is not what
  # npm/scripts/postinstall.js hands anybody, while -gnu is reachable from this ubuntu runner for
  # the price of a linker package. The aarch64 Windows build shares what is checked here, since
  # what these arms are gated on is `windows` rather than the architecture.
  #
  # Linting, not running. The suite needs a Windows host, and it spawns a POSIX shell, drives a pty
  # and exercises a confinement backend Windows has none of; whether those are made to work is the
  # question of whether Windows is supported at all, which is #88.
  windows:
    name: Lint the Windows target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        # Pinned to a full commit SHA; see the note in the `check` job above.
        # nosemgrep: brave-third-party-action-not-pinned-to-commit-sha
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # ring compiles C for whichever target it is built for, so the C half needs a cross compiler
      # even though the Rust half needs none. Nothing is linked: clippy stops before that, which is
      # what makes a Windows host unnecessary.
      - name: Install the cross compiler ring builds with
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Clippy
        # --locked where the two sibling clippy jobs do without it: they each run a locked
        # command afterwards, and this job is the only check the Windows target has, so a
        # manifest and a lockfile that disagree would go unreported here.
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets --all-features --locked -- -D warnings

  npm-lockfile:
    name: npm lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install from the lockfile and lint it
        run: |
          npm ci --ignore-scripts
          npm run lint:lockfile
          npm run lint:lockfile:website
          npm run lint:lockfile:ui

  # The documentation website under docs/website. Docusaurus throws on broken links or
  # broken anchors, so this job validates documentation correctness across the tree.
  docs:
    name: Documentation website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      # --ignore-scripts because this job runs on a pull request, which means it runs the
      # install hooks of whatever a fork put in the lockfile. The site builds without them.
      - name: Build documentation website
        run: |
          npm --prefix docs/website ci --ignore-scripts
          npm --prefix docs/website run build

  # The mechanical half of docs/specs, which decides nothing a person has to read a diff for:
  # clause numbering, the tests a clause names, the paths it governs, and the call sites a
  # guarded symbol pins. Standard library Python over the checkout, so it needs no toolchain
  # and answers in seconds. Without it the guard allowlist only holds for whoever remembers to
  # run it, which is the state it exists to replace.
  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the specs against the implementation
        run: make check-spec

  # The mechanical half of the security audit: whether two documents agree on how many exceptions
  # to the label rule are admitted, whether anything reaches into a Labelled, whether a spec pins
  # the constructors, whether every workflow step is on a commit rather than a movable tag, and
  # whether a job holding a credential installs or runs a dependency beside it.
  # Standard library Python like the specs job. It was held out of CI while `Labelled::trusted`
  # had no `guards` entry and the check therefore failed; it has one as of this change.
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit the label rule mechanically
        run: make check-security

  # Whether every message catalog matches contrib/untranslated-messages.txt. A translation may lag the
  # reference, since what it lacks is shown in English and a catalog nobody could use unfinished
  # would never be started, so what this decides is whether the lag is written down. The build
  # script counts it too and prints a warning, which is silent on a cached build and does not fail
  # a green job, so before this nothing stopped a message shipping untranslated: eleven had.
  # Standard library Python like the two jobs above.
  locales:
    name: Locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hold the catalogs to the record of what they are missing
        run: make check-locales

  # Whether every file that states the version states the same one: the workspace manifest, the
  # published wrapper and its lockfile, and the desktop application and its lockfile. The tagging
  # path refuses a disagreement as well, but that is release day, and folding the front end in
  # brought a manifest that had been at 0.1.0 against a 0.9.0 workspace with nothing to say so.
  # Standard library Python like the three jobs above, so it needs no toolchain.
  versions:
    name: Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that every file stating the version agrees
        run: make check-versions

  # Builds against the declared minimum toolchain. The pinned cross-build container
  # ships an older Rust than most developers have locally, so without this a feature
  # that only compiles on a newer toolchain reaches the release build unnoticed.
  minimum-toolchain:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read rust-version from the workspace
        id: msrv
        run: |
          version="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::rust-version is not declared in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        # Pinned to a full commit SHA; see the note in the `check` job above.
        # nosemgrep: brave-third-party-action-not-pinned-to-commit-sha
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --all --locked

  cross-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            target: aarch64-apple-darwin
            ext: ""
          - name: darwin-amd64
            target: x86_64-apple-darwin
            ext: ""
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - name: windows-amd64
            target: x86_64-pc-windows-gnu
            ext: ".exe"
          - name: windows-arm64
            target: aarch64-pc-windows-gnullvm
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Dockerfile the Makefile uses, so a local build and a CI build produce
      # the same artifact rather than diverging through a separate host toolchain.
      #
      # No credentials are baked in. Every job here carries the permission to compile
      # without them, which is what lets a fork or a pull request run this at all.
      # The binaries people install are built and signed by Jenkins.
      - name: Build ${{ matrix.target }}
        run: |
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          printf 'export BRAVEBOT_ALLOW_UNCONFIGURED_BUILD=%s\n' \
            "$BRAVEBOT_ALLOW_UNCONFIGURED_BUILD" > "$env_file"
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.cross \
            -t bravebot-${{ matrix.name }} \
            --build-arg TARGET=${{ matrix.target }} \
            --secret id=bravebot_env,src="$env_file" .

      - name: Extract binary
        run: |
          mkdir -p dist
          docker create --name extract bravebot-${{ matrix.name }} /dev/null
          docker cp extract:/bravebot "dist/bravebot-${{ matrix.name }}${{ matrix.ext }}"
          docker rm extract

      - name: Verify the artifact is the expected format
        run: file "dist/bravebot-${{ matrix.name }}${{ matrix.ext }}"

  # The front end under ui/: its TypeScript, its Node tests, and one real Electron
  # walkthrough under Xvfb.
  #
  # The `check` job above is what lints and tests the two bridge crates, as members of the
  # workspace like any other: path-filtering them away by directory would rebuild the
  # submodule problem inside one repository, which is the whole thing folding the front end
  # in was meant to fix. This job compiles them anyway, because `npm run build` runs
  # `scripts/build-bridge.sh` to produce the two binaries the app spawns, so it needs the
  # toolchain and the cache the sibling Rust jobs have.
  ui:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        # Pinned to a full commit SHA; see the note in the `check` job above.
        # nosemgrep: brave-third-party-action-not-pinned-to-commit-sha
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64

      # The Electron package is needed to typecheck src/main and src/preload against it. The
      # runtime binary is needed as well, for the walkthrough below, so this install does not
      # set ELECTRON_SKIP_BINARY_DOWNLOAD.
      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Build and run the Node tests
        working-directory: ui
        run: |
          npm run build
          node --test scripts/*.test.mjs

      - name: Walkthrough regression
        working-directory: ui
        timeout-minutes: 5
        run: xvfb-run -a node scripts/drive-manual-walkthrough.mjs
