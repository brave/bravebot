name: Mutation testing

# A passing suite says every assertion held, and not that the assertions would fail if the code were
# wrong. cargo-mutants changes the code one thing at a time, runs the tests, and reports each change
# they did not fail on. A crate takes hours, so this runs against the default branch on a clock, in
# shards, and what it finds is a report to read rather than a gate on anybody's review. The pull
# request trigger below runs only the report's selftest, which takes seconds and is the thing most
# likely to break silently.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      package:
        description: The crate to mutate
        default: bravebot-core
  pull_request:
    paths:
      - contrib/measure-mutants.py
      - .github/workflows/mutation-testing.yml

permissions:
  contents: read

env:
  BRAVEBOT_ALLOW_UNCONFIGURED_BUILD: "1"
  # The number of slices the crate is cut into, which the matrix below has to list one of each.
  SHARDS: "6"

jobs:
  # A report that matches nothing says a clean suite forever, which is indistinguishable from having
  # no measurement at all. This compiles nothing and needs no toolchain.
  parser:
    name: Report selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the report
        run: python3 contrib/measure-mutants.py --selftest

  # bravebot-core is the crate whose tests are the evidence for the rule this repository exists for:
  # labels, the policy that reads them, and the gates. A missed change in it is a behaviour no test
  # would notice losing. Its three thousand changes are about two to five seconds each, so six shards
  # of two jobs each take under an hour a shard.
  #
  # Holds no grant beyond reading and no secret: this job builds and runs every build script, proc
  # macro and test in Cargo.lock, so whatever it held would be readable by code nobody here wrote
  # (#2789). The `report` job below runs none of it.
  measure:
    name: Shard ${{ matrix.shard }}
    needs: parser
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      # The checkout otherwise leaves the job token in the repository's git config, where every
      # process this job starts could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        # Pinned to a full commit SHA; see the note in ci.yml's `check` job.
        # nosemgrep: brave-third-party-action-not-pinned-to-commit-sha
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-mutants
        # Pinned to a full commit SHA, like every other step here.
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-mutants@27.1.0

      # What this step measures is saved to a file, and the next job reads the files.
      - name: Measure
        env:
          PACKAGE: ${{ inputs.package || 'bravebot-core' }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 contrib/measure-mutants.py run --package "$PACKAGE" --shard "$SHARD/$SHARDS" --jobs 2 \
            --save "$RUNNER_TEMP/outcomes-$SHARD.json"

      - name: Keep what was measured
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/outcomes-${{ matrix.shard }}.json
          if-no-files-found: error

  # Joins the shards into one report. No rate fails this job: going red over a list of missed
  # changes is the state this exists to replace. It runs no cargo and holds no grant beyond reading.
  report:
    name: Report of every shard
    needs: measure
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards

      - name: Report
        run: |
          python3 contrib/measure-mutants.py report "$RUNNER_TEMP"/shards/*.json --shards "$SHARDS" \
            --summary "$GITHUB_STEP_SUMMARY"
