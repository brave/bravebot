# Gradle includes @react-native/gradle-plugin from ../node_modules, a package react-native
# depends on rather than the app, and Metro and the React Native CLI also walk node_modules
# from the app directory. pnpm's default layout puts neither at the top level.
nodeLinker: hoisted

# react-native reaches body-parser through @react-native/community-cli-plugin, and 2.3.0 carries
# GHSA-27r3-jxmh-p828. 2.4.0 fixes it. Remove this once react-native depends on 2.4.0 or later.
overrides:
  body-parser: "^2.4.0"

# The React Native CLI reaches fast-xml-parser through @react-native-community/cli-config-android, and
# 5.11.2 carries GHSA-474x-hrwr-fgx4. 5.12.0 fixes it. Remove this once the CLI depends on 5.12.0 or later.
  fast-xml-parser: "^5.12.0"

# Known high advisories in build-time tooling (Metro, the React Native CLI, Jest) that are not part of the
# app bundle; braces and picomatch (GHSA-fc5q-39xc-vjpf, a ReDoS in extglob matching) have no patched
# release. Remove the picomatch entry once a release above 4.0.7 is published and the lockfile uses it.
# Any other high or critical advisory fails `pnpm audit --audit-level=high` in CI.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-fc5q-39xc-vjpf
