allowBuilds:
  "@brave/leo@https://codeload.github.com/brave/leo/tar.gz/c5f9c8f78f3df5b767a83ad67babd8b29323266a": true
  electron-winstaller: false
  esbuild: false
  svelte-preprocess: false

# @brave/leo reaches storybook through @storybook/test, and storybook 8.6.18 and the
# @storybook/core it pins carry GHSA-f2ph-cmg5-wxc8. 8.6.19 fixes it and pins the matching core.
# Nothing in ui imports storybook. Remove this once the @brave/leo pin depends on 8.6.19 or later.
overrides:
  storybook: "^8.6.19"

# Known high advisories the dependency tree still carries; braces and picomatch (GHSA-fc5q-39xc-vjpf,
# a ReDoS in extglob matching, reached through build-time tooling) have no patched release.
# Remove the picomatch entry once a release above 4.0.7 is published and the lockfile uses it.
# Any other high or critical advisory fails `pnpm audit --audit-level=high` in CI.
auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-fc5q-39xc-vjpf

# @electron/packager walks dependencies from node_modules/<name> without following symlinks, so
# pnpm's default layout fails it on packages whose own dependencies sit beside them in .pnpm.
nodeLinker: hoisted
