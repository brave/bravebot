# bravebot bakes its backend credentials in at build time (see
# crates/config/build.rs upstream): a release binary is built where the secrets are and
# used anywhere, so it does not demand them again from every directory it starts in. A
# build with no credentials fails rather than quietly producing a binary that only works
# in the tree it came from.
#
# Development builds of the bridge have no secrets and do not need them: nothing here
# talks to the backend until a turn runs, and a developer's own `bravebot` is already
# configured. So we opt into the unconfigured build, which produces a binary that must be
# configured from the environment at run time.
#
# A packaged release of the app must NOT rely on this. It has to be built the way the
# agent's own releases are, with the credentials present, or the app will ship unable to
# reach the backend. See docs/phase-0-rpc-protocol.md §3.1.
[env]
BRAVEBOT_ALLOW_UNCONFIGURED_BUILD = "1"
