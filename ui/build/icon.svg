<!-- The About mascot, seed "brave-bot-mascot", drawn as FlatAvatar in src/renderer/components/BotAvatar.tsx draws it, on the rounded tile a macOS icon sits on. icon.icns beside it is made from this file: docs/development.md says how. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf5"/>
      <stop offset="1" stop-color="#e4e1d3"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#8fae55"/>
      <stop offset="100%" stop-color="#6f8841"/>
    </linearGradient>
    <clipPath id="edge">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g clip-path="url(#edge)">
    <g transform="translate(112 134) scale(8)" stroke="#50622d" stroke-width="1.4" stroke-linejoin="round">
      <rect x="30" y="70" width="40" height="46" rx="18" fill="#6f8841"/>
      <ellipse cx="50" cy="74" rx="20" ry="5" fill="#50622d" opacity="0.15" stroke="none"/>
      <ellipse cx="16" cy="45" rx="5" ry="7" fill="#c8d5b7"/>
      <ellipse cx="84" cy="45" rx="5" ry="7" fill="#c8d5b7"/>
      <rect x="16" y="17" width="68" height="56" rx="12" fill="url(#head)"/>
      <rect x="48.2" y="9" width="3.6" height="10" fill="#c8d5b7"/>
      <circle cx="50" cy="9" r="4.5" fill="#c8d5b7"/>
      <g stroke="none">
        <circle cx="36" cy="50" r="5.2" fill="#20222b"/>
        <circle cx="37.768" cy="48.128" r="2.184" fill="#ffffff"/>
        <circle cx="64" cy="50" r="5.2" fill="#20222b"/>
        <circle cx="65.768" cy="48.128" r="2.184" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
