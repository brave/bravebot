[workspace]
resolver = "3"
members = ["crates/bravebot-bridge", "crates/bravebot-ui-files"]
# The agent is a path dependency inside this tree (a submodule), and it is its own
# workspace. Without this, cargo pulls its crates into ours and both complain.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches bravebot's own floor. Building against its crates with an older
# toolchain than it requires would fail in its sources, not ours, which is a confusing
# place to discover a version problem.
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
